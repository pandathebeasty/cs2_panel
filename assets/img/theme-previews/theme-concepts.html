<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CS2 Panel Theme Concepts</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; background: #08090d; }
body { width: 1280px; font-family: Bahnschrift, "Arial Narrow", sans-serif; }
.concept { --bg:#07100b; --side:#050b08; --panel:#0b1710; --line:#173c27; --accent:#39ff88; --accent2:#9affbd; --text:#e5ffed; --muted:#7ba98b; position: relative; width:1280px; height:720px; overflow:hidden; color:var(--text); background:var(--bg); }
.concept + .concept { margin-top: 24px; }
.concept::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.35; }
.terminal::before { background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(57,255,136,.07) 4px),radial-gradient(circle at 70% 35%,rgba(57,255,136,.1),transparent 45%); }
.carbon { --bg:#0b0d0e; --side:#08090a; --panel:#141718; --line:#303637; --accent:#75f0bd; --accent2:#d4fff0; --text:#f0f5f3; --muted:#87918e; }
.carbon::before { background:linear-gradient(45deg,rgba(255,255,255,.025) 25%,transparent 25% 75%,rgba(255,255,255,.025) 75%),linear-gradient(45deg,rgba(255,255,255,.025) 25%,transparent 25% 75%,rgba(255,255,255,.025) 75%); background-size:16px 16px; background-position:0 0,8px 8px; }
.nuke { --bg:#11140d; --side:#0b0e08; --panel:#191d12; --line:#3b4324; --accent:#d7ef3f; --accent2:#f3ff9a; --text:#f4f6df; --muted:#a3a77a; }
.nuke::before { background:repeating-linear-gradient(135deg,rgba(215,239,63,.04) 0 2px,transparent 2px 30px),radial-gradient(circle at 70% 42%,rgba(119,147,29,.16),transparent 48%); }
.broadcast { --bg:#0c0c10; --side:#111116; --panel:#17171d; --line:#32323c; --accent:#ff334f; --accent2:#ffc857; --text:#f8f8fb; --muted:#94949f; }
.broadcast::before { background:linear-gradient(120deg,transparent 55%,rgba(255,51,79,.08)),linear-gradient(155deg,transparent 65%,rgba(255,200,87,.05)); }
.sidebar { position:absolute; inset:0 auto 0 0; width:230px; padding:28px 20px; background:color-mix(in srgb,var(--side) 94%,transparent); border-right:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:12px; margin-bottom:34px; }
.mark { width:38px; height:38px; display:grid; place-items:center; border:1px solid var(--accent); color:var(--accent); font:900 17px "Cascadia Mono",Consolas,monospace; box-shadow:0 0 18px color-mix(in srgb,var(--accent) 20%,transparent); }
.brand strong { font-size:19px; letter-spacing:1px; }
.brand small { display:block; color:var(--muted); font:10px "Cascadia Mono",Consolas,monospace; letter-spacing:2px; }
.nav { display:grid; gap:7px; }
.nav div { padding:11px 13px; color:var(--muted); border-left:2px solid transparent; font-size:13px; letter-spacing:.5px; }
.nav .active { color:var(--text); background:color-mix(in srgb,var(--accent) 10%,transparent); border-left-color:var(--accent); }
.status { position:absolute; left:20px; right:20px; bottom:24px; padding:13px; border:1px solid var(--line); background:var(--panel); color:var(--muted); font:11px "Cascadia Mono",Consolas,monospace; }
.dot { display:inline-block; width:7px; height:7px; margin-right:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 9px var(--accent); }
.main { position:absolute; inset:0 0 0 230px; padding:0 34px 30px; }
.top { height:78px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
.eyebrow { color:var(--accent); font:11px "Cascadia Mono",Consolas,monospace; letter-spacing:2px; text-transform:uppercase; }
h1 { margin:3px 0 0; font-size:25px; letter-spacing:.5px; }
.admin { color:var(--muted); font:12px "Cascadia Mono",Consolas,monospace; }
.metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:24px 0 18px; }
.metric,.panel { position:relative; background:color-mix(in srgb,var(--panel) 94%,transparent); border:1px solid var(--line); }
.metric { height:104px; padding:18px; overflow:hidden; }
.metric::after { content:""; position:absolute; right:-18px; bottom:-24px; width:74px; height:74px; border:12px solid color-mix(in srgb,var(--accent) 12%,transparent); border-radius:50%; }
.metric span { color:var(--muted); font-size:11px; letter-spacing:1px; text-transform:uppercase; }
.metric b { display:block; margin-top:8px; font:800 29px "Cascadia Mono",Consolas,monospace; }
.metric em { color:var(--accent); font-size:11px; font-style:normal; }
.grid { display:grid; grid-template-columns:1.55fr 1fr; gap:18px; }
.panel { height:424px; padding:20px; }
.panel-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; font-size:14px; letter-spacing:1px; text-transform:uppercase; }
.panel-title i { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); }
.chart { height:135px; display:flex; align-items:end; gap:9px; padding:16px 4px 0; border-bottom:1px solid var(--line); background:repeating-linear-gradient(0deg,transparent 0 31px,color-mix(in srgb,var(--line) 40%,transparent) 32px); }
.bar { flex:1; min-height:15%; height:var(--h); background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 25%,transparent)); opacity:.82; }
.table { margin-top:18px; }
.row { display:grid; grid-template-columns:1.3fr .8fr .7fr; align-items:center; min-height:43px; border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent); font-size:12px; }
.row.head { min-height:30px; color:var(--muted); font:10px "Cascadia Mono",Consolas,monospace; text-transform:uppercase; }
.tag { justify-self:start; padding:4px 7px; color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,transparent); border:1px solid color-mix(in srgb,var(--accent) 35%,transparent); font:10px "Cascadia Mono",Consolas,monospace; }
.server { padding:14px 0; border-bottom:1px solid var(--line); }
.server:last-child { border:0; }
.server strong { display:block; font-size:13px; }
.server small { color:var(--muted); }
.progress { height:5px; margin-top:10px; background:var(--bg); overflow:hidden; }
.progress b { display:block; width:var(--w); height:100%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
.broadcast .mark,.broadcast .metric,.broadcast .panel,.broadcast .status { border-radius:4px; }
.broadcast .panel-title { border-left:4px solid var(--accent); padding-left:10px; }
.nuke .mark,.nuke .metric,.nuke .panel,.nuke .status { border-radius:2px; }
.nuke .panel-title::after { content:"CAUTION // LIVE"; color:var(--accent); font:9px "Cascadia Mono",Consolas,monospace; }
.terminal .mark,.terminal .metric,.terminal .panel,.terminal .status { border-radius:0; }
.carbon .mark,.carbon .metric,.carbon .panel,.carbon .status { border-radius:6px; }
</style>
</head>
<body>
<script>
const themes = [
  ['terminal','Terminal Green','SYSTEM ONLINE'],
  ['carbon','Carbon HUD','TACTICAL INTERFACE'],
  ['nuke','Nuke Facility','FACILITY CONTROL'],
  ['broadcast','Tournament Broadcast','MATCH OPERATIONS']
];
const metrics = [['PLAYERS','84','+12 live'],['ACTIVE BANS','1,248','+8 today'],['ADMINS','26','all synced'],['SERVERS','4 / 4','operational']];
const rows = [['Nexus','76561198012345678','ACTIVE'],['Reaktor','76561198192746120','ACTIVE'],['Kinetic','76561198283109214','EXPIRED']];
document.body.innerHTML = themes.map(([id,name,kicker]) => `
<section class="concept ${id}" id="${id}">
  <aside class="sidebar"><div class="brand"><div class="mark">GO</div><div><strong>LLG PANEL</strong><small>${kicker}</small></div></div>
  <div class="nav"><div class="active">01 / Dashboard</div><div>02 / Bans</div><div>03 / Mutes</div><div>04 / Warnings</div><div>05 / Servers</div><div>06 / Admins</div><div>07 / Settings</div></div>
  <div class="status"><span class="dot"></span>RCON CONNECTED<br><small>latency 18 ms</small></div></aside>
  <main class="main"><header class="top"><div><div class="eyebrow">${name}</div><h1>Command Dashboard</h1></div><div class="admin">ROOT ADMIN&nbsp;&nbsp; 21:48</div></header>
  <div class="metrics">${metrics.map(x=>`<div class="metric"><span>${x[0]}</span><b>${x[1]}</b><em>${x[2]}</em></div>`).join('')}</div>
  <div class="grid"><section class="panel"><div class="panel-title"><span>Moderation activity</span><i></i></div><div class="chart">${[42,70,48,88,62,95,74,84,55,78,91,68].map(h=>`<span class="bar" style="--h:${h}%"></span>`).join('')}</div>
  <div class="table"><div class="row head"><span>Player</span><span>SteamID</span><span>Status</span></div>${rows.map(r=>`<div class="row"><strong>${r[0]}</strong><span>${r[1].slice(-8)}</span><span class="tag">${r[2]}</span></div>`).join('')}</div></section>
  <section class="panel"><div class="panel-title"><span>Server network</span><i></i></div>${[['Retakes EU',72],['Competitive #1',91],['Arena 1v1',48],['Practice',34]].map(s=>`<div class="server"><strong>${s[0]}</strong><small>${Math.round(s[1]/3.1)} / 32 players</small><div class="progress" style="--w:${s[1]}%"><b></b></div></div>`).join('')}</section></div></main>
</section>`).join('');
</script>
</body>
</html>
