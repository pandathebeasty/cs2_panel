<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GO LLG logo">
  <defs>
    <linearGradient id="go" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d55"/>
      <stop offset="1" stop-color="#e01e37"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="6" y="6" width="108" height="108" rx="26" fill="#12131a"/>
  <rect x="6" y="6" width="108" height="108" rx="26" fill="none" stroke="url(#go)" stroke-width="2" opacity=".6"/>
  <g filter="url(#glow)">
    <text x="60" y="68" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="49" font-weight="900" letter-spacing="-2" fill="url(#go)">GO</text>
  </g>
  <text x="60" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#e8eaf2">LLG</text>
</svg>