; Per-directory PHP overrides for CGI/FastCGI hosts (most shared hosting).
; The skins/rarity refresh downloads and json_decodes several multi-MB files
; (ByMykel stickers/collectibles), which blows past a tiny default memory_limit
; and 500s with "Allowed memory size exhausted". Give PHP room.
; Note: .user.ini changes can take a few minutes to apply (PHP caches it for
; user_ini.cache_ttl, default 300s), or restart PHP / wait, then retry.
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
