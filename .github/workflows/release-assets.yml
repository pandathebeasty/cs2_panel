name: Release assets

# Builds the split archives the in-panel updater prefers over the full GitHub
# zipball: core (code + small assets), maps (map images) and skins (WeaponPaints
# catalog). Users who untick maps/skins in the update dialog download only core.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build assets for
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # For a manual run, use the tag if it exists; otherwise build the selected
      # branch and create the requested tag and release after building.
      - name: Resolve tag
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "$TAG"
          else
            echo "Tag $TAG not found; building $GITHUB_REF_NAME ($GITHUB_SHA)"
          fi

      - name: Build archives
        run: |
          set -euo pipefail
          # Every archive has one top-level folder, like the GitHub zipball.
          ROOT=cs2_panel
          mkdir -p "dist/$ROOT"
          git archive --format=tar HEAD | tar -x -C "dist/$ROOT"
          cd dist
          zip -qr -9 cs2-panel-core.zip "$ROOT" \
            -x "$ROOT/assets/img/maps/*" "$ROOT/public/assets/img/maps/*" "$ROOT/app/Data/weaponpaints/*" "$ROOT/assets/3d/*" "$ROOT/.github/*"
          maps=""
          for d in "$ROOT/assets/img/maps" "$ROOT/public/assets/img/maps"; do
            if [ -d "$d" ]; then maps="$maps $d"; fi
          done
          if [ -n "$maps" ]; then zip -qr -9 cs2-panel-maps.zip $maps; fi
          if [ -d "$ROOT/app/Data/weaponpaints" ]; then zip -qr -9 cs2-panel-skins.zip "$ROOT/app/Data/weaponpaints"; fi
          ls -lh ./*.zip

      # Optional 3D models for the Skins preview (MIT, LielXD/CS2-WeaponPaints-Website).
      # Too large for git, so they ship only as a release asset; textures stay on the mirror.
      - name: Build 3D models archive
        continue-on-error: true
        run: |
          set -euo pipefail
          ROOT=cs2_panel
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/LielXD/CS2-WeaponPaints-Website.git lielxd
          git -C lielxd sparse-checkout set --no-cone '/src/[[]models]/*' '/LICENSE'
          mkdir -p "dist/m/$ROOT/assets/3d/models"
          cp lielxd/src/\[models\]/*.glb "dist/m/$ROOT/assets/3d/models/"
          cp lielxd/LICENSE "dist/m/$ROOT/assets/3d/LICENSE-models.txt"
          # Charm models for the 3D preview (FireFOXXCZ/cs2-weaponpaints-website-redesign)
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/FireFOXXCZ/cs2-weaponpaints-website-redesign.git ffx
          git -C ffx sparse-checkout set --no-cone '/assets/3d/keychains/*'
          mkdir -p "dist/m/$ROOT/assets/3d/keychains"
          cp ffx/assets/3d/keychains/*.glb "dist/m/$ROOT/assets/3d/keychains/"
          echo "{\"source\":\"LielXD/CS2-WeaponPaints-Website\",\"commit\":\"$(git -C lielxd rev-parse HEAD)\"}" > "dist/m/$ROOT/assets/3d/manifest.json"
          (cd dist/m && zip -qr -1 ../cs2-panel-models.zip "$ROOT")
          rm -rf dist/m lielxd ffx
          ls -lh dist/cs2-panel-models.zip

      - name: Upload to the release
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" --title "$TAG" --generate-notes
          fi
