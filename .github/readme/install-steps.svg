<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="960" height="230" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1420"/>
      <stop offset="1" stop-color="#161d2e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>
  <rect width="960" height="230" rx="18" fill="url(#bg)"/>
  <text x="40" y="44" fill="#e8ecf4" font-size="20" font-weight="700">Installation in 6 steps</text>
  <path d="M110 120H850" stroke="#2c3650" stroke-width="3"/>
  <g font-size="13" text-anchor="middle">
    <g transform="translate(110 120)">
      <circle r="28" fill="url(#acc)"/><text y="6" fill="#0f1420" font-size="18" font-weight="800">1</text>
      <text y="56" fill="#e8ecf4" font-weight="700">Download</text>
      <text y="74" fill="#8892a6" font-size="11.5">cs2-panel-core.zip</text>
    </g>
    <g transform="translate(258 120)">
      <circle r="28" fill="url(#acc)"/><text y="6" fill="#0f1420" font-size="18" font-weight="800">2</text>
      <text y="56" fill="#e8ecf4" font-weight="700">Upload</text>
      <text y="74" fill="#8892a6" font-size="11.5">web root or subfolder</text>
    </g>
    <g transform="translate(406 120)">
      <circle r="28" fill="url(#acc)"/><text y="6" fill="#0f1420" font-size="18" font-weight="800">3</text>
      <text y="56" fill="#e8ecf4" font-weight="700">Database</text>
      <text y="74" fill="#8892a6" font-size="11.5">same DB as the plugins</text>
    </g>
    <g transform="translate(554 120)">
      <circle r="28" fill="url(#acc)"/><text y="6" fill="#0f1420" font-size="18" font-weight="800">4</text>
      <text y="56" fill="#e8ecf4" font-weight="700">Wizard</text>
      <text y="74" fill="#8892a6" font-size="11.5">open /install</text>
    </g>
    <g transform="translate(702 120)">
      <circle r="28" fill="url(#acc)"/><text y="6" fill="#0f1420" font-size="18" font-weight="800">5</text>
      <text y="56" fill="#e8ecf4" font-weight="700">Steam login</text>
      <text y="74" fill="#8892a6" font-size="11.5">as the owner</text>
    </g>
    <g transform="translate(850 120)">
      <circle r="28" fill="url(#acc)"/><text y="6" fill="#0f1420" font-size="18" font-weight="800">6</text>
      <text y="56" fill="#e8ecf4" font-weight="700">Finish</text>
      <text y="74" fill="#8892a6" font-size="11.5">Settings · cron · /system</text>
    </g>
  </g>
</svg>
